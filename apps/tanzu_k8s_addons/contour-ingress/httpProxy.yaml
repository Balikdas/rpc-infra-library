apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: app-ingress
  namespace: default
spec:
  virtualhost:
    fqdn: ${external_fqdn}
    tls:
      secretName: ${tls_secret_name}
  routes:
    - conditions:
      - prefix: /
      services:
        - name: ${internal_svc_name}
          port: 8080
